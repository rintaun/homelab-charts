{{- if eq .Values.secret.mode "external" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "shelfarr.secretName" . }}
  labels:
    {{- include "shelfarr.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind }}
  target:
    name: {{ include "shelfarr.secretName" . }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- else if eq .Values.secret.mode "create" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shelfarr.secretName" . }}
  labels:
    {{- include "shelfarr.labels" . | nindent 4 }}
type: Opaque
stringData:
  RAILS_MASTER_KEY: {{ required "secret.railsMasterKey is required when secret.mode is \"create\"" .Values.secret.railsMasterKey | quote }}
  {{- if .Values.secret.activeRecordEncryptionPrimaryKey }}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: {{ .Values.secret.activeRecordEncryptionPrimaryKey | quote }}
  {{- end }}
  {{- if .Values.secret.activeRecordEncryptionDeterministicKey }}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: {{ .Values.secret.activeRecordEncryptionDeterministicKey | quote }}
  {{- end }}
  {{- if .Values.secret.activeRecordEncryptionKeyDerivationSalt }}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: {{ .Values.secret.activeRecordEncryptionKeyDerivationSalt | quote }}
  {{- end }}
{{- end }}
