{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shelfarr.secretName" . }}
  labels:
    {{- include "shelfarr.labels" . | nindent 4 }}
type: Opaque
stringData:
  RAILS_MASTER_KEY: {{ required "secret.railsMasterKey is required when secret.existingSecret is empty" .Values.secret.railsMasterKey | quote }}
  {{- if .Values.secret.activeRecordEncryptionPrimaryKey }}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: {{ .Values.secret.activeRecordEncryptionPrimaryKey | quote }}
  {{- end }}
  {{- if .Values.secret.activeRecordEncryptionDeterministicKey }}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: {{ .Values.secret.activeRecordEncryptionDeterministicKey | quote }}
  {{- end }}
  {{- if .Values.secret.activeRecordEncryptionKeyDerivationSalt }}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: {{ .Values.secret.activeRecordEncryptionKeyDerivationSalt | quote }}
  {{- end }}
{{- end }}

