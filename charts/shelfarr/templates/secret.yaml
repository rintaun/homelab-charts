{{- if eq .Values.secret.mode "external" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "shelfarr.secretName" . }}
  labels:
    {{- include "shelfarr.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: {{ .Values.externalSecret.secretStoreKind }}
  target:
    name: {{ include "shelfarr.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: rails-master-key
      remoteRef:
        key: {{ .Values.externalSecret.remoteRef.key }}
        property: {{ .Values.externalSecret.remoteRef.property }}
{{- else if eq .Values.secret.mode "create" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shelfarr.secretName" . }}
  labels:
    {{- include "shelfarr.labels" . | nindent 4 }}
type: Opaque
stringData:
  rails-master-key: {{ required "secret.railsMasterKey is required when secret.mode is \"create\"" .Values.secret.railsMasterKey | quote }}
{{- end }}
