{{- if .Values.worker.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shelfarr.fullname" . }}-worker
  labels:
    {{- include "shelfarr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "shelfarr.selectorLabels" . | nindent 6 }}
      component: worker
  template:
    metadata:
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "shelfarr.selectorLabels" . | nindent 8 }}
        component: worker
    spec:
      serviceAccountName: {{ include "shelfarr.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-worker
          image: {{ include "shelfarr.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bundle", "exec", "rake", "solid_queue:start"]
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.config.railsLogLevel }}
            - name: RAILS_LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.railsMaxThreads }}
            - name: RAILS_MAX_THREADS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.webConcurrency }}
            - name: WEB_CONCURRENCY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.jobConcurrency }}
            - name: JOB_CONCURRENCY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.port }}
            - name: PORT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.pidfile }}
            - name: PIDFILE
              value: {{ . | quote }}
            {{- end }}
            - name: SOLID_QUEUE_IN_PUMA
              value: "0"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: RAILS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "shelfarr.secretName" . }}
                  key: RAILS_MASTER_KEY
            {{- if or .Values.secret.activeRecordEncryptionPrimaryKey (not (eq .Values.secret.mode "create")) }}
            - name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "shelfarr.secretName" . }}
                  key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
            {{- end }}
            {{- if or .Values.secret.activeRecordEncryptionDeterministicKey (not (eq .Values.secret.mode "create")) }}
            - name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "shelfarr.secretName" . }}
                  key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
            {{- end }}
            {{- if or .Values.secret.activeRecordEncryptionKeyDerivationSalt (not (eq .Values.secret.mode "create")) }}
            - name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "shelfarr.secretName" . }}
                  key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- range $vol := .Values.volumes }}
            {{- range $mount := $vol.mounts }}
            - name: {{ $vol.name }}
              mountPath: {{ $mount.path }}
              {{- if $mount.subPath }}
              subPath: {{ $mount.subPath }}
              {{- end }}
              {{- if $mount.readOnly }}
              readOnly: {{ $mount.readOnly }}
              {{- end }}
            {{- end }}
            {{- end }}
      volumes:
        {{- range $vol := .Values.volumes }}
        - name: {{ $vol.name }}
          {{- if $vol.persistence }}
          persistentVolumeClaim:
            {{- $defaultClaimName := printf "%s-%s" (include "shelfarr.fullname" $) $vol.name }}
            {{- if eq $vol.name "data" }}
              {{- $defaultClaimName = include "shelfarr.dataClaimName" $ }}
            {{- end }}
            claimName: {{ tpl (default $defaultClaimName $vol.persistence.claimName) $ | quote }}
          {{- else }}
          {{- $volSource := omit $vol "name" "persistence" "mounts" }}
          {{- toYaml $volSource | nindent 10 }}
          {{- end }}
        {{- end }}
{{- end }}
