---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shelfarr.fullname" . }}
  labels:
    {{- include "shelfarr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "shelfarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "shelfarr.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shelfarr.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "shelfarr.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: SOLID_QUEUE_IN_PUMA
              value: {{ .Values.config.solidQueueInPuma | quote }}
            - name: PUID
              value: {{ .Values.config.puid | quote }}
            - name: PGID
              value: {{ .Values.config.pgid | quote }}
            - name: RAILS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "shelfarr.secretName" . }}
                  key: rails-master-key
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- range $vol := .Values.volumes }}
            {{- range $mount := $vol.mounts }}
            - name: {{ $vol.name }}
              mountPath: {{ $mount.path }}
              {{- if $mount.subPath }}
              subPath: {{ $mount.subPath }}
              {{- end }}
              {{- if $mount.readOnly }}
              readOnly: {{ $mount.readOnly }}
              {{- end }}
            {{- end }}
            {{- end }}
      volumes:
        {{- range $vol := .Values.volumes }}
        - name: {{ $vol.name }}
          {{- if $vol.persistence }}
          persistentVolumeClaim:
            {{- $defaultClaimName := printf "%s-%s" (include "shelfarr.fullname" $) $vol.name }}
            {{- if eq $vol.name "data" }}
              {{- $defaultClaimName = include "shelfarr.dataClaimName" $ }}
            {{- end }}
            claimName: {{ tpl (default $defaultClaimName $vol.persistence.claimName) $ | quote }}
          {{- else }}
          {{- $volSource := omit $vol "name" "persistence" "mounts" }}
          {{- toYaml $volSource | nindent 10 }}
          {{- end }}
        {{- end }}
