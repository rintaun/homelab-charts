{{- if .Values.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cooktrace.secretName" . }}
  labels:
    {{- include "cooktrace.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "secret.jwtSecret is required when secret.create is true" .Values.secret.jwtSecret | quote }}
  {{- with .Values.secret.tokenEncKey }}
  token-enc-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.recoveryToken }}
  recovery-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.oidcClientSecret }}
  oidc-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.smtpPass }}
  smtp-pass: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.aiApiKey }}
  ai-api-key: {{ . | quote }}
  {{- end }}
{{- end }}
