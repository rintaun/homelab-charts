suite: cooktrace secret tests
templates:
  - secret.yaml
tests:
  - it: should not render a Secret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should require jwtSecret when create is true
    set:
      secret.create: true
    asserts:
      - failedTemplate:
          errorMessage: secret.jwtSecret is required when secret.create is true

  - it: should only include keys that have values
    set:
      secret.create: true
      secret.jwtSecret: jwt
      secret.oidcClientSecret: oidc
    asserts:
      - equal:
          path: stringData
          value:
            jwt-secret: jwt
            oidc-client-secret: oidc
