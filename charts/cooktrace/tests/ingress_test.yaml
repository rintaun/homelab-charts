suite: cooktrace ingress tests
templates:
  - ingress.yaml
tests:
  - it: should not render Ingress without a host
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render Ingress when disabled
    set:
      ingress.enabled: false
      ingress.host: cooktrace.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: should route the host to the service port
    set:
      ingress.host: cooktrace.example.com
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: cooktrace.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 3003
      - equal:
          path: spec.tls[0].secretName
          value: cooktrace.example.com
